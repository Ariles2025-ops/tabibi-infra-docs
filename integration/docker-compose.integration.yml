# Pile d'integration reelle de Tabibi : PostgreSQL 16 + Keycloak 26 (realm de tabibi-backend importe, comptes de
# demonstration) + l'API construite depuis les sources de tabibi-backend (profil postgres, migrations Liquibase).
# Elle sert au scenario integration/scenario-api.mjs (lance par integration/lancer.sh et par le workflow
# .github/workflows/integration.yml) ; le front web est ensuite lance a part, face a cette pile.
#
# Prerequis : le depot tabibi-backend clone a cote de celui-ci (../../tabibi-backend depuis ce dossier), ou son
# chemin dans TABIBI_BACKEND_DIR. Ports publies : 8080 (API) et 8081 (Keycloak), comme en developpement.
#   docker compose -f docker-compose.integration.yml up -d --build
#   docker compose -f docker-compose.integration.yml down -v
#
# Emetteur des jetons : Keycloak est fige sur http://localhost:8081 (KC_HOSTNAME) pour que les jetons obtenus depuis
# la machine hote portent cet emetteur ; l'API attend le meme emetteur et lit les cles de signature en interne
# (keycloak:8080), comme docker-compose.prod.yml de tabibi-backend (emetteur public, cles sur le reseau interne).
name: tabibi-integration

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tabibi
      POSTGRES_USER: tabibi
      POSTGRES_PASSWORD: tabibi
    volumes:
      - tabibi-integration-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tabibi -d tabibi"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Emetteur fixe des jetons, quel que soit l'hote par lequel Keycloak est appele (localhost:8081 depuis la
      # machine, keycloak:8080 depuis l'API).
      KC_HOSTNAME: http://localhost:8081
      KC_HTTP_ENABLED: "true"
      # Sondes /health/* sur le port de gestion 9000 (interne).
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8081:8080"
    volumes:
      # Realm de developpement de tabibi-backend (source de verite, testee par RealmKeycloakTest) : importe au
      # premier demarrage. Un seul fichier est monte pour ne jamais importer un realm de production genere a cote.
      - ${TABIBI_BACKEND_DIR:-../../tabibi-backend}/infra/keycloak/tabibi-realm.json:/opt/keycloak/data/import/tabibi-realm.json:ro
    healthcheck:
      # L'image n'a ni curl ni wget : bash ouvre la connexion TCP et lit la ligne de statut de /health/ready.
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  backend:
    build:
      context: ${TABIBI_BACKEND_DIR:-../../tabibi-backend}
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tabibi
      SPRING_DATASOURCE_USERNAME: tabibi
      SPRING_DATASOURCE_PASSWORD: tabibi
      # Emetteur attendu dans les jetons (celui que Keycloak inscrit, voir KC_HOSTNAME) ; cles lues en interne.
      TABIBI_KEYCLOAK_ISSUER: http://localhost:8081/realms/tabibi
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/tabibi/protocol/openid-connect/certs
      # Origine du front web lance face a cette pile (port 4200, celui du realm de developpement).
      TABIBI_CORS_ORIGINES: http://localhost:4200
      # Acces direct, sans reverse proxy.
      SERVER_FORWARD_HEADERS_STRATEGY: none
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      # L'API ne contacte Keycloak qu'a la premiere verification de jeton : pas besoin d'attendre sa sante ici
      # (lancer.sh attend le realm avant de lancer le scenario).
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s

volumes:
  tabibi-integration-pg:
