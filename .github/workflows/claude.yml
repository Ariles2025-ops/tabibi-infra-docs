# Agent développeur Claude : on l'appelle en écrivant @claude dans un ticket ou une PR
# (ou en ouvrant un ticket qui contient @claude). Il lit le code, corrige, et ouvre ou met à jour une PR.
# La PR passe la CI comme toute autre ; rien ne part en production sans fusion.
name: Claude
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]
jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: --max-turns 60 --allowedTools "Bash(gh pr create:*),Bash(gh pr list:*),Bash(gh issue comment:*),Bash(git:*),Bash(npm ci),Bash(npm run *),Bash(npx ng *),Bash(./mvnw *),Bash(mvn *),Bash(flutter *),Bash(dart *),Bash(node *),Read,Edit,Write,Glob,Grep" --append-system-prompt "Quand ton travail est fini et poussé sur ta branche claude/..., ouvre TOI-MÊME la pull request vers main avec gh pr create (titre et description en français, avec Closes #<numéro du ticket>). Ne te contente pas d'un lien Create PR. Ne pousse jamais sur main."
